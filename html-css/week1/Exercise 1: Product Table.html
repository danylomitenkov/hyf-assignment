<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Exercise 1: Product Table.css" />
    <title>Exercise 1: Product Table | Mitenkov Danylo</title>
  </head>
  <body class="body">
    <main>
      <table class="table">
        <caption class="table-caption">
          Available Products
        </caption>
        <thead>
          <tr>
            <th>Product Name</th>
            <th>Price</th>
            <th>In Stock</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Chair</td>
            <td>2000 DKK</td>
            <td>Yes</td>
          </tr>
          <tr>
            <td>Sofa</td>
            <td>2500 DKK</td>
            <td>Yes</td>
          </tr>
          <tr>
            <td>Keyboard</td>
            <td>50 DKK</td>
            <td>No</td>
          </tr>
        </tbody>
      </table>
      <button class="button">Click me</button>
    </main>
  </body>
</html>
